name: rikkei-ss06-banking01

services:
  core-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: banking_db
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}"
    ports:
      - "5432:5432"
    volumes:
      - banking-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d banking_db"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - banking-net

  account-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: account-service:latest
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://core-db:5432/banking_db"
      SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER:?POSTGRES_USER required}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}"
    depends_on:
      core-db:
        condition: service_healthy
    networks:
      - banking-net

volumes:
  banking-db-data:

networks:
  banking-net:
